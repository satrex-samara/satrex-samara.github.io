name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          STATIC_EXPORT: "1"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait until IndexNow key is live
        run: |
          KEY=$(python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path("public").glob("*.txt"):
              key = p.stem
              if re.fullmatch(r"[a-zA-Z0-9-]{8,128}", key) and p.read_text(encoding="utf-8").strip() == key:
                  print(key)
                  break
          else:
              raise SystemExit("IndexNow key file not found")
          PY
          )
          echo "Checking https://satrex-samara.github.io/${KEY}.txt"
          for i in $(seq 1 18); do
            if curl -fsS "https://satrex-samara.github.io/${KEY}.txt" | grep -qx "$KEY"; then
              echo "Key file is live"
              exit 0
            fi
            echo "Attempt $i: key not live yet, waiting 10s"
            sleep 10
          done
          echo "Key file did not become available in time"
          exit 1
      - name: Submit URLs to IndexNow
        run: node scripts/indexnow.mjs
